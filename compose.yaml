services:
  landing:
    build:
      context: .
      target: landing
    container_name: taskminder-landing
    restart: always
    ports:
      - "127.0.0.1:3002:80"
    environment:
      APP_HOST: app.taskminder.de
      # Restrict nginx entrypoint's envsubst pass to APP_HOST, so that
      # nginx variables such as $request_uri are not blanked out
      NGINX_ENVSUBST_FILTER: "APP_HOST"

  app:
    build: .
    container_name: taskminder-app
    restart: always
    expose:
      - "9100"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=PRODUCTION
    secrets:
      - session_secret
      - database_url
      - encryption_key
      - encryption_key_secondary
      - encryption_key_lookup
      - proxy_hop
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./db-backups:/backups
      - clamav-data:/var/lib/clamav
      - app-data:/usr/src/app/data

  postgres:
    image: postgres:18
    container_name: taskminder-postgres
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$(cat /run/secrets/db_user) -d $$(cat /run/secrets/db_name)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    secrets:
      - db_user
      - db_password
      - db_name
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB_FILE: /run/secrets/db_name
    volumes:
      # postgres 18+, mounts to /var/lib/postgresql (NOT ..../data).
      # official PG18 image changed its internal PGDATA to /var/lib/postgresql/18/docker.
      # mounting the parent directory allows for version-specific subdirectories, 
      # which enables easier major-version upgrades using 'pg_upgrade --link'.
      # for more information, see https://hub.docker.com/_/postgres#pgdata
      - postgres-data:/var/lib/postgresql
      - ./db-backups:/backups 

  redis:
    image: redis:8
    container_name: taskminder-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/recording-rules.yml:/etc/prometheus/recording-rules.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - app

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: always
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
  
  alloy:
    image: grafana/alloy:v1.20.0
    container_name: alloy
    restart: always
    volumes:
      - ./monitoring/alloy-config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    command:
      - "run"
      - "--storage.path=/var/lib/alloy"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki
      - prometheus
      - app

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-provisioning/:/etc/grafana/provisioning/
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki

secrets:
  db_user:
    file: ./docker_secrets/db_user.txt
  db_password:
    file: ./docker_secrets/db_password.txt
  db_name:
    file: ./docker_secrets/db_name.txt
  session_secret:
    file: ./docker_secrets/session_secret.txt
  database_url:
    file: ./docker_secrets/database_url.txt
  encryption_key:
    file: ./docker_secrets/encryption_key.txt
  encryption_key_secondary:
    file: ./docker_secrets/encryption_key_secondary.txt
  encryption_key_lookup:
    file: ./docker_secrets/encryption_key_lookup.txt
  proxy_hop:
    file: ./docker_secrets/proxy_hop.txt

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
  app-data:
  clamav-data:
